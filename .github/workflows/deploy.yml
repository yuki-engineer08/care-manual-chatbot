name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # src/ または template.yaml が変わった時だけ sam build/deploy を実行する
      - name: Check backend changes
        id: backend
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|template\.yaml)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install SAM CLI
        if: steps.backend.outputs.changed == 'true'
        run: pip install aws-sam-cli

      - name: sam build
        if: steps.backend.outputs.changed == 'true'
        run: sam build

      - name: sam deploy
        if: steps.backend.outputs.changed == 'true'
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Get stack outputs
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name care-manual-chatbot \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          CF_ID=$(aws cloudformation describe-stacks \
            --stack-name care-manual-chatbot \
            --region ap-northeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "cf_id=$CF_ID" >> $GITHUB_OUTPUT

      - name: Upload frontend to S3
        run: aws s3 sync static/ s3://${{ steps.stack.outputs.bucket }}/

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.cf_id }} \
            --paths "/*"
