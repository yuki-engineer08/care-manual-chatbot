<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>介護スタッフ向けチャットボット</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    background: #f5f5f5;
  }
  h1 {
    font-size: 20px;
  }
  h2 {
    font-size: 15px;
    margin: 16px 0 8px;
  }
  #chat {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 45vh;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 12px;
  }
  .msg {
    margin-bottom: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .msg .role {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .msg.user .role { color: #1565c0; }
  .msg.assistant .role { color: #2e7d32; }
  .msg .body > *:first-child { margin-top: 0; }
  .msg .body > *:last-child { margin-bottom: 0; }
  .msg .body h1,
  .msg .body h2,
  .msg .body h3 {
    margin: 12px 0 6px;
  }
  .msg .body ul,
  .msg .body ol {
    margin: 6px 0;
    padding-left: 1.4em;
  }

  .panel {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .field {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
  }
  .field label {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .field input,
  .field select,
  .field textarea {
    padding: 8px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .field textarea {
    resize: vertical;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
  }
  #send {
    padding: 10px 16px;
    width: 100%;
    font-size: 15px;
  }
  #send:disabled {
    opacity: 0.5;
  }

  .topbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  #toggleReports {
    padding: 8px 14px;
    font-size: 14px;
  }
  #reportsPanel {
    display: none;
  }
  #reportsPanel.open {
    display: block;
  }
  #mainView.hidden {
    display: none;
  }
  .report-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .report-list-item {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fafafa;
  }
  .report-list-item:hover {
    background: #eef3fb;
  }
  .report-list-item .report-time {
    font-weight: bold;
    font-size: 13px;
  }
  .report-empty {
    color: #777;
    padding: 12px 0;
  }
  #reportDetail {
    margin-top: 12px;
  }
  #reportDetail h3 {
    font-size: 14px;
    margin: 14px 0 6px;
  }
  .report-fields-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .report-fields-table td {
    border: 1px solid #ddd;
    padding: 6px 8px;
    vertical-align: top;
  }
  .report-fields-table td.field-label {
    font-weight: bold;
    width: 30%;
    background: #f5f5f5;
    white-space: nowrap;
  }
  #backToList {
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <button id="toggleReports" type="button">報告書一覧</button>
  </div>

  <div id="mainView">
  <h1>介護スタッフ向けチャットボット（事故報告支援）</h1>

  <div id="chat"></div>

  <form id="form">
    <div class="panel">
      <h2>利用者・施設条件</h2>
      <div class="grid">
        <div class="field">
          <label for="adl">利用者ADL</label>
          <select id="adl">
            <option value="自立">自立</option>
            <option value="一部介助">一部介助</option>
            <option value="全介助">全介助</option>
          </select>
        </div>
        <div class="field">
          <label for="dementia">認知症の有無</label>
          <select id="dementia">
            <option value="あり">あり</option>
            <option value="なし">なし</option>
          </select>
        </div>
        <div class="field">
          <label for="fallRisk">転倒リスク評価</label>
          <select id="fallRisk">
            <option value="高">高</option>
            <option value="中">中</option>
            <option value="低">低</option>
          </select>
        </div>
        <div class="field">
          <label for="facilityType">施設種別</label>
          <select id="facilityType">
            <option value="特養">特養</option>
            <option value="老健">老健</option>
            <option value="グループホーム">グループホーム</option>
            <option value="その他">その他</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>事故発見時の状況</h2>
      <div class="grid">
        <div class="field">
          <label for="time">何時</label>
          <input id="time" type="text" placeholder="例: 14時30分頃" />
        </div>
        <div class="field">
          <label for="place">どこで</label>
          <input id="place" type="text" placeholder="例: 居室、トイレ前" />
        </div>
      </div>
      <div class="field">
        <label for="fallResponse">転倒時対応</label>
        <textarea id="fallResponse" rows="2" placeholder="発見時に行った対応"></textarea>
      </div>
      <div class="field">
        <label for="vitals">バイタル</label>
        <textarea id="vitals" rows="2" placeholder="血圧・脈拍・体温・SpO2など"></textarea>
      </div>
      <div class="field">
        <label for="statement">発言</label>
        <textarea id="statement" rows="2" placeholder="利用者本人の発言内容"></textarea>
      </div>
      <div class="field">
        <label for="injury">外傷・可動域の変化</label>
        <textarea id="injury" rows="2" placeholder="外傷の有無、可動域の変化など"></textarea>
      </div>
      <div class="field">
        <label for="afterResponse">転倒後対応</label>
        <textarea id="afterResponse" rows="2" placeholder="その後の対応・報告・受診状況など"></textarea>
      </div>
      <div class="field">
        <label for="input">補足・その他</label>
        <textarea id="input" rows="4" placeholder="その他、補足したい内容があれば入力してください"></textarea>
      </div>
    </div>

    <button id="send" type="submit">送信</button>
  </form>
  </div>

  <div id="reportsPanel" class="panel">
    <div id="reportListView">
      <h2>保存済み報告書一覧</h2>
      <div id="reportListContainer"></div>
    </div>
    <div id="reportDetailView" style="display:none;">
      <button id="backToList" type="button">← 一覧に戻る</button>
      <div id="reportDetail"></div>
    </div>
  </div>

<script>
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const sendEl = document.getElementById("send");

  const settingIds = ["adl", "dementia", "fallRisk", "facilityType"];
  const fieldDefs = [
    ["time", "何時"],
    ["place", "どこで"],
    ["fallResponse", "転倒時対応"],
    ["vitals", "バイタル"],
    ["statement", "発言"],
    ["injury", "外傷・可動域の変化"],
    ["afterResponse", "転倒後対応"],
    ["input", "補足・その他"],
  ];
  const allFieldIds = [...settingIds, ...fieldDefs.map(([id]) => id)];
  const DRAFT_KEY = "incidentReportDraft";

  const messages = [];

  function saveDraft() {
    const draft = {};
    for (const id of allFieldIds) {
      draft[id] = document.getElementById(id).value;
    }
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  }

  function loadDraft() {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return;
    let draft;
    try {
      draft = JSON.parse(raw);
    } catch {
      return;
    }
    for (const id of allFieldIds) {
      if (Object.prototype.hasOwnProperty.call(draft, id)) {
        document.getElementById(id).value = draft[id];
      }
    }
  }

  function clearDraft() {
    localStorage.removeItem(DRAFT_KEY);
  }

  for (const id of allFieldIds) {
    const el = document.getElementById(id);
    el.addEventListener("input", saveDraft);
    el.addEventListener("change", saveDraft);
  }
  loadDraft();

  function setBodyContent(body, role, content) {
    if (role === "assistant") {
      body.innerHTML = marked.parse(content);
    } else {
      body.textContent = content;
    }
  }

  function appendMessage(role, content) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const roleLabel = document.createElement("div");
    roleLabel.className = "role";
    roleLabel.textContent = role === "user" ? "あなた" : "アシスタント";
    const body = document.createElement("div");
    body.className = "body";
    setBodyContent(body, role, content);
    div.appendChild(roleLabel);
    div.appendChild(body);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return body;
  }

  function buildReportText() {
    const lines = [];

    lines.push("【利用者・施設条件】");
    lines.push("利用者ADL: " + document.getElementById("adl").value);
    lines.push("認知症の有無: " + document.getElementById("dementia").value);
    lines.push("転倒リスク評価: " + document.getElementById("fallRisk").value);
    lines.push("施設種別: " + document.getElementById("facilityType").value);
    lines.push("");
    lines.push("【事故発見時の状況】");
    for (const [id, label] of fieldDefs) {
      const value = document.getElementById(id).value.trim();
      if (value) {
        lines.push(label + ": " + value);
      }
    }
    return lines.join("\n");
  }

  function hasAnyContent() {
    return fieldDefs.some(([id]) => document.getElementById(id).value.trim());
  }

  function collectReportFields() {
    const fields = {};
    for (const id of allFieldIds) {
      fields[id] = document.getElementById(id).value;
    }
    return fields;
  }

  function clearFields() {
    for (const [id] of fieldDefs) {
      document.getElementById(id).value = "";
    }
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!hasAnyContent()) return;

    const text = buildReportText();
    const reportFields = collectReportFields();
    sendEl.disabled = true;

    messages.push({ role: "user", content: text });
    appendMessage("user", text);
    const replyBody = appendMessage("assistant", "...");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, report_fields: reportFields }),
      });
      if (!res.ok) {
        throw new Error("リクエストに失敗しました: " + res.status);
      }
      const data = await res.json();
      messages.push({ role: "assistant", content: data.reply });
      setBodyContent(replyBody, "assistant", data.reply);
      clearFields();
      clearDraft();
    } catch (err) {
      setBodyContent(replyBody, "assistant", "エラーが発生しました: " + err.message);
    } finally {
      sendEl.disabled = false;
    }
  });

  // --- Sprint 6: 報告書一覧・詳細表示 ---
  const mainViewEl = document.getElementById("mainView");
  const reportsPanelEl = document.getElementById("reportsPanel");
  const toggleReportsEl = document.getElementById("toggleReports");
  const reportListViewEl = document.getElementById("reportListView");
  const reportDetailViewEl = document.getElementById("reportDetailView");
  const reportListContainerEl = document.getElementById("reportListContainer");
  const reportDetailEl = document.getElementById("reportDetail");
  const backToListEl = document.getElementById("backToList");

  const fieldLabelMap = {};
  for (const [id, label] of fieldDefs) {
    fieldLabelMap[id] = label;
  }
  const settingLabelMap = {
    adl: "利用者ADL",
    dementia: "認知症の有無",
    fallRisk: "転倒リスク評価",
    facilityType: "施設種別",
  };
  const allLabelMap = { ...settingLabelMap, ...fieldLabelMap };

  function formatTimestamp(isoString) {
    const d = new Date(isoString);
    if (isNaN(d.getTime())) return isoString;
    return d.toLocaleString("ja-JP");
  }

  function showReportList() {
    reportDetailViewEl.style.display = "none";
    reportListViewEl.style.display = "block";
  }

  async function openReportsPanel() {
    mainViewEl.classList.add("hidden");
    reportsPanelEl.classList.add("open");
    toggleReportsEl.textContent = "チャットに戻る";
    showReportList();
    await loadReportList();
  }

  function closeReportsPanel() {
    mainViewEl.classList.remove("hidden");
    reportsPanelEl.classList.remove("open");
    toggleReportsEl.textContent = "報告書一覧";
  }

  let reportsPanelOpen = false;
  toggleReportsEl.addEventListener("click", () => {
    reportsPanelOpen = !reportsPanelOpen;
    if (reportsPanelOpen) {
      openReportsPanel();
    } else {
      closeReportsPanel();
    }
  });

  backToListEl.addEventListener("click", showReportList);

  async function loadReportList() {
    reportListContainerEl.innerHTML = "<div class=\"report-empty\">読み込み中...</div>";
    try {
      const res = await fetch("/api/reports");
      if (!res.ok) {
        throw new Error("リクエストに失敗しました: " + res.status);
      }
      const reports = await res.json();
      renderReportList(reports);
    } catch (err) {
      reportListContainerEl.innerHTML =
        "<div class=\"report-empty\">報告書の取得に失敗しました: " + err.message + "</div>";
    }
  }

  function renderReportList(reports) {
    if (!reports || reports.length === 0) {
      reportListContainerEl.innerHTML = "<div class=\"report-empty\">報告書がありません</div>";
      return;
    }

    const sorted = [...reports].sort(
      (a, b) => new Date(b.submitted_at) - new Date(a.submitted_at)
    );

    const ul = document.createElement("ul");
    ul.className = "report-list";
    for (const report of sorted) {
      const li = document.createElement("li");
      li.className = "report-list-item";

      const timeDiv = document.createElement("div");
      timeDiv.className = "report-time";
      timeDiv.textContent = formatTimestamp(report.submitted_at);
      li.appendChild(timeDiv);

      const previewText = (report.reply || "").slice(0, 60).replace(/\n/g, " ");
      if (previewText) {
        const previewDiv = document.createElement("div");
        previewDiv.className = "report-preview";
        previewDiv.textContent = previewText + (report.reply.length > 60 ? "..." : "");
        li.appendChild(previewDiv);
      }

      li.addEventListener("click", () => showReportDetail(report));
      ul.appendChild(li);
    }
    reportListContainerEl.innerHTML = "";
    reportListContainerEl.appendChild(ul);
  }

  function showReportDetail(report) {
    reportDetailEl.innerHTML = "";

    const timeP = document.createElement("p");
    timeP.innerHTML = "<strong>提出日時:</strong> " + formatTimestamp(report.submitted_at);
    reportDetailEl.appendChild(timeP);

    const fieldsHeading = document.createElement("h3");
    fieldsHeading.textContent = "フォーム入力内容";
    reportDetailEl.appendChild(fieldsHeading);

    const table = document.createElement("table");
    table.className = "report-fields-table";
    const fields = report.fields || {};
    for (const id of Object.keys(fields)) {
      const value = fields[id];
      if (!value) continue;
      const tr = document.createElement("tr");
      const tdLabel = document.createElement("td");
      tdLabel.className = "field-label";
      tdLabel.textContent = allLabelMap[id] || id;
      const tdValue = document.createElement("td");
      tdValue.style.whiteSpace = "pre-wrap";
      tdValue.textContent = value;
      tr.appendChild(tdLabel);
      tr.appendChild(tdValue);
      table.appendChild(tr);
    }
    reportDetailEl.appendChild(table);

    const replyHeading = document.createElement("h3");
    replyHeading.textContent = "アシスタントの生成結果";
    reportDetailEl.appendChild(replyHeading);

    const replyDiv = document.createElement("div");
    replyDiv.className = "body";
    replyDiv.innerHTML = marked.parse(report.reply || "");
    reportDetailEl.appendChild(replyDiv);

    reportListViewEl.style.display = "none";
    reportDetailViewEl.style.display = "block";
  }
</script>
</body>
</html>
