<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>介護スタッフ向けチャットボット</title>
<style>
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    background: #f5f5f5;
  }
  h1 {
    font-size: 20px;
  }
  #chat {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 60vh;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 12px;
  }
  .msg {
    margin-bottom: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .msg .role {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .msg.user .role { color: #1565c0; }
  .msg.assistant .role { color: #2e7d32; }
  #form {
    display: flex;
    gap: 8px;
  }
  #input {
    flex: 1;
    padding: 8px;
    font-size: 14px;
  }
  #send {
    padding: 8px 16px;
  }
  #send:disabled {
    opacity: 0.5;
  }
</style>
</head>
<body>
  <h1>介護スタッフ向けチャットボット</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="質問を入力してください" autocomplete="off" />
    <button id="send" type="submit">送信</button>
  </form>

<script>
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  const messages = [];

  function appendMessage(role, content) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const roleLabel = document.createElement("div");
    roleLabel.className = "role";
    roleLabel.textContent = role === "user" ? "あなた" : "アシスタント";
    const body = document.createElement("div");
    body.textContent = content;
    div.appendChild(roleLabel);
    div.appendChild(body);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return body;
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    sendEl.disabled = true;

    messages.push({ role: "user", content: text });
    appendMessage("user", text);
    const replyBody = appendMessage("assistant", "...");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      if (!res.ok) {
        throw new Error("リクエストに失敗しました: " + res.status);
      }
      const data = await res.json();
      messages.push({ role: "assistant", content: data.reply });
      replyBody.textContent = data.reply;
    } catch (err) {
      replyBody.textContent = "エラーが発生しました: " + err.message;
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>
